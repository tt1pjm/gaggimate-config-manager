<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaggimate Custom Web Installer</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 40px; background: #121212; color: #fff; }
        .card { max-width: 500px; margin: 20px auto; padding: 30px; border-radius: 12px; background: #1e1e1e; border: 1px solid #333; }
        h1 { margin-bottom: 30px; color: #00e676; }
        .btn-group { margin: 25px 0; display: flex; justify-content: space-around; }
        esp-web-install-button { --esp-button-bg-color: #00e676; --esp-button-text-color: #121212; }
    </style>
    <!-- Imports the official ESP Web Tools library used for browser flashing -->
    <script type="module" src="https://unpkg.com"></script>
</head>
<body>

    <div class="card">
        <h1>Gaggimate Custom Flash Panel</h1>
        <p>Connect your module via USB (Chrome, Edge, or Opera) to install your custom-built firmware profiles.</p>
        
        <div class="btn-group">
            <div>
                <h3>Controller Module</h3>
                <esp-web-install-button manifest="controller/manifest.json"></esp-web-install-button>
            </div>
            <div>
                <h3>Display Module</h3>
                <esp-web-install-button manifest="display/manifest.json"></esp-web-install-button>
            </div>
        </div>
    </div>

</body>
</html>

name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src

      - name: Inject and Apply Board Overrides
        run: |
          # Create targets inside the gaggimate source path context
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          
          # Copy your custom configurations into the upstream location
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          # Move inside the project root where platformio.ini lives
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          
          # Execute code generation targets relative to the project root
          python3 scripts/generate_board_override.py
          
          # The bash script executes correctly because it finds the relative 'lib/' folder here
          ./scripts/apply_board_override_patch.sh

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      - name: Install PlatformIO and Build
        run: |
          pip install platformio
          # Execute compilation inside the directory containing platformio.ini
          cd gaggimate-src
          
          # Target only your physical hardware variables
          pio run -e controller -e display-waveshare-1.75-amoled

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gaggimate-src/.pio/build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

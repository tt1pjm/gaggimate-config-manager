name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src

      - name: Setup Node.js (Required for Web Portal Build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build WebUI Frontend Assets
        run: |
          cd gaggimate-src
          if [ -f "scripts/build_webui.sh" ]; then
            chmod +x scripts/build_webui.sh
            ./scripts/build_webui.sh
          fi

      - name: Inject and Apply Board Overrides
        run: |
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          
          python3 scripts/generate_board_override.py
          ./scripts/apply_board_override_patch.sh

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      # TARGET CORRECTION: Compiles your exact hardware definitions
      - name: Install PlatformIO and Build
        run: |
          pip install platformio
          cd gaggimate-src
          
          # Compiles partition profiles for the Waveshare 1.75 inch AMOLED screen target
          pio run -e display-waveshare-1.75-amoled -t buildfs
          pio run -e display-waveshare-1.75-amoled
          pio run -e controller

      - name: Prepare WebUSB and OTA Assets
        run: |
          mkdir -p final-pages-site/controller final-pages-site/display
          
          cp config-repo/index.html final-pages-site/
          cp config-repo/controller/manifest.json final-pages-site/controller/manifest.json
          cp config-repo/display/manifest.json final-pages-site/display/manifest.json
          
          # Extract and position your custom controller binary parts
          cp gaggimate-src/.pio/build/controller/firmware.bin final-pages-site/controller/firmware.bin
          cp gaggimate-src/.pio/build/controller/bootloader.bin final-pages-site/controller/bootloader.bin
          cp gaggimate-src/.pio/build/controller/partitions.bin final-pages-site/controller/partitions.bin
          
          # Extract and position your exact Waveshare display binary parts
          cp gaggimate-src/.pio/build/display-waveshare-1.75-amoled/firmware.bin final-pages-site/display/firmware.bin
          cp gaggimate-src/.pio/build/display-waveshare-1.75-amoled/bootloader.bin final-pages-site/display/bootloader.bin
          cp gaggimate-src/.pio/build/display-waveshare-1.75-amoled/partitions.bin final-pages-site/display/partitions.bin
          
          # Extract the compiled Waveshare LittleFS filesystem block
          if [ -f "gaggimate-src/.pio/build/display-waveshare-1.75-amoled/littlefs.bin" ]; then
            cp gaggimate-src/.pio/build/display-waveshare-1.75-amoled/littlefs.bin final-pages-site/display/filesystem.bin
          elif [ -f "gaggimate-src/.pio/build/display-waveshare-1.75-amoled/spiffs.bin" ]; then
            cp gaggimate-src/.pio/build/display-waveshare-1.75-amoled/spiffs.bin final-pages-site/display/filesystem.bin
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

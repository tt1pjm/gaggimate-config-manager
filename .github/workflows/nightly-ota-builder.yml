name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      # GIT CONTEXT FIX: Pulls logs so version generation scripts have text fields to evaluate
      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src
          fetch-depth: 0 # Pulls full branch histories so git tag histories are visible

      - name: Setup Node.js (Required for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build WebUI Frontend Assets
        run: |
          cd gaggimate-src
          if [ -d "web" ]; then
            cd web
            find . -type f -exec sed -i 's|jniebuhr/gaggimate|tt1pjm/gaggimate-config-manager|g' {} +
            npm ci
            npm run build
            cd ..
          fi
          
          find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.ini" \) -exec sed -i 's|jniebuhr/gaggimate|tt1pjm/gaggimate-config-manager|g' {} +
          
          mkdir -p src/display/webassets
          if [ -f "scripts/build_webui.sh" ]; then
            chmod +x scripts/build_webui.sh
            ./scripts/build_webui.sh
          fi

      # GIT MOCK PHASE: Safely triggers the codebase's internal auto-version tracker scripts dynamically
      - name: Inject Custom Version Metadata
        id: version_vars
        run: |
          # 1. Pull the absolute latest real milestone release tag straight from the upstream repo logs
          cd gaggimate-src
          UPSTREAM_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.8.1")
          cd ..
          
          # Clean the string to ensure it contains only alphanumeric values, hyphens, and dots
          UPSTREAM_VERSION=$(echo "$UPSTREAM_VERSION" | sed 's/[^a-zA-Z0-9.-]//g')
          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "-" ]; then
            UPSTREAM_VERSION="v1.8.1"
          fi
          [[ "$UPSTREAM_VERSION" != v* ]] && UPSTREAM_VERSION="v$UPSTREAM_VERSION"
          
          # 2. Append high-precision timestamp runtime variables to allow instant multi-run OTA updates
          VERSION_STRING="${UPSTREAM_VERSION}-custom-nightly-$(date +'%Y%m%d%H%M%S')-${{ github.run_number }}"
          echo "Discovered Upstream Version: $UPSTREAM_VERSION"
          echo "Generated Tracking Signature: $VERSION_STRING"
          
          echo "$VERSION_STRING" > gaggimate-src/version.txt
          echo "firmware_version=$VERSION_STRING" >> $GITHUB_OUTPUT
          
          # 3. Create a local dummy tag inside the builder folder context
          # The codebase version script invokes 'git describe' at compile time and will now read this string cleanly!
          cd gaggimate-src
          git config --global user.email "automation@github.com"
          git config --global user.name "Actions Builder"
          git tag -f -a "$VERSION_STRING" -m "Automated build profile tracking custom configurations"
          cd ..

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      # RESTORED BLOCK: Compiles display firmware AND generates the filesystem partition assets safely
      - name: Compile and Package All Firmware Targets
        env:
          PLATFORMIO_BUILD_FLAGS: '-D GAGGIMATE_VERSION=\"${{ steps.version_vars.outputs.firmware_version }}\" -D FIRMWARE_VERSION=\"${{ steps.version_vars.outputs.firmware_version }}\"'
        run: |
          pip install platformio
          mkdir -p final-pages-site/controller final-pages-site/display
          
          cd gaggimate-src
          
          # Compile display firmware and data filesystem image binaries
          pio run -e display -t buildfs
          pio run -e display
          
          cp .pio/build/display/firmware.bin ../final-pages-site/display/firmware.bin || cp .pio/build/LilyGo-T-RGB/firmware.bin ../final-pages-site/display/firmware.bin
          cp .pio/build/display/bootloader.bin ../final-pages-site/display/bootloader.bin || cp .pio/build/LilyGo-T-RGB/bootloader.bin ../final-pages-site/display/bootloader.bin
          cp .pio/build/display/partitions.bin ../final-pages-site/display/partitions.bin || cp .pio/build/LilyGo-T-RGB/partitions.bin ../final-pages-site/display/partitions.bin
          
          # Search for and copy the generated filesystem partition image dynamically
          FS_BIN=$(find .pio/build/ -type f \( -name "littlefs.bin" -o -name "spiffs.bin" \) | head -n 1)
          if [ -n "$FS_BIN" ]; then
            echo "Successfully discovered compiled Web UI filesystem partition image at: $FS_BIN"
            cp "$FS_BIN" ../final-pages-site/display/filesystem.bin
          else
            # Deep fallback size inspection lookup block
            FS_FALLBACK=$(find .pio/build/ -type f -size +100k ! -name "firmware.bin" ! -name "*.elf" ! -name "*.map" | head -n 1)
            if [ -n "$FS_FALLBACK" ]; then
              cp "$FS_FALLBACK" ../final-pages-site/display/filesystem.bin
            else
              echo "WARNING: Filesystem asset binary skipped. Building with fallback layout."
            fi
          fi
          
          cd ..
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          python3 scripts/generate_board_override.py
          ./scripts/apply_board_override_patch.sh
          
          # Compile controller firmware using the exact same injection flags
          pio run -e controller
          
          cp .pio/build/controller/firmware.bin ../final-pages-site/controller/firmware.bin
          cp .pio/build/controller/bootloader.bin ../final-pages-site/controller/bootloader.bin
          cp .pio/build/controller/partitions.bin ../final-pages-site/controller/partitions.bin
          
          cd ..
          cp config-repo/index.html final-pages-site/
          cp config-repo/controller/manifest.json final-pages-site/controller/manifest.json
          cp config-repo/display/manifest.json final-pages-site/display/manifest.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # RESTORED 4-FILE RELEASE BLOCK: Prepares all binaries matching upstream definitions exactly
      - name: Prepare Official Release Structural Artifacts
        id: release_prep
        run: |
          mkdir -p release-artifacts
          cp gaggimate-src/version.txt release-artifacts/version.txt
          
          # Controller
          cp final-pages-site/controller/firmware.bin release-artifacts/board-firmware.bin
          cp final-pages-site/controller/bootloader.bin release-artifacts/board-bootloader.bin
          cp final-pages-site/controller/partitions.bin release-artifacts/board-partitions.bin
          
          # Display (Includes the crucial filesystem element asset required for successful OTA update routines)
          cp final-pages-site/display/firmware.bin release-artifacts/display-firmware.bin
          cp final-pages-site/display/bootloader.bin release-artifacts/display-bootloader.bin
          cp final-pages-site/display/partitions.bin release-artifacts/display-partitions.bin
          if [ -f "final-pages-site/display/filesystem.bin" ]; then
            cp final-pages-site/display/filesystem.bin release-artifacts/display-filesystem.bin
          fi

      - name: Publish Custom OTA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Release"
          body: "Official custom tracking workspace build channel for standard controller extension profiles."
          draft: false
          prerelease: true
          make_latest: true
          files: |
            release-artifacts/version.txt
            release-artifacts/board-firmware.bin
            release-artifacts/board-bootloader.bin
            release-artifacts/board-partitions.bin
            release-artifacts/display-firmware.bin
            release-artifacts/display-bootloader.bin
            release-artifacts/display-partitions.bin
            release-artifacts/display-filesystem.bin

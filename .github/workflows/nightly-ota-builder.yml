name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src

      - name: Setup Node.js (Required for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build WebUI Frontend Assets
        run: |
          cd gaggimate-src
          if [ -d "web" ]; then
            cd web
            npm ci
            npm run build
            cd ..
          fi
          if [ -f "scripts/build_webui.sh" ]; then
            chmod +x scripts/build_webui.sh
            ./scripts/build_webui.sh
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      - name: Install PlatformIO and Build Display Unpatched
        run: |
          pip install platformio
          cd gaggimate-src
          
          # Force build and print errors explicitly if it crashes
          pio run -e display || (echo "=== DISPLAY COMPILATION FAILED CRITICAL LOGS ===" && cat .pio/build/display/program.log || true; exit 1)

      # MOVED STEP: Board overrides are now injected only after the display finishes compiling
      - name: Inject and Apply Board Overrides for Controller
        run: |
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          
          python3 scripts/generate_board_override.py
          ./scripts/apply_board_override_patch.sh

      - name: Compile Patched Controller Firmware
        run: |
          cd gaggimate-src
          # Compiles the controller using your specific custom pin definitions
          pio run -e controller

      - name: Prepare WebUSB and OTA Assets
        run: |
          # DIAGNOSTIC STEP: Print the exact file names and folders PlatformIO actually generated
          echo "=== ACTUAL PLATFORMIO BUILD FOLDERS ==="
          ls -R gaggimate-src/.pio/build/
          echo "========================================"
          
          mkdir -p final-pages-site/controller final-pages-site/display
          
          cp config-repo/index.html final-pages-site/
          cp config-repo/controller/manifest.json final-pages-site/controller/manifest.json
          cp config-repo/display/manifest.json final-pages-site/display/manifest.json
          
          # Extract and position your custom controller binary parts
          cp gaggimate-src/.pio/build/controller/firmware.bin final-pages-site/controller/firmware.bin
          cp gaggimate-src/.pio/build/controller/bootloader.bin final-pages-site/controller/bootloader.bin
          cp gaggimate-src/.pio/build/controller/partitions.bin final-pages-site/controller/partitions.bin
          
          # Extract and position your display binary parts
          cp gaggimate-src/.pio/build/display/firmware.bin final-pages-site/display/firmware.bin
          cp gaggimate-src/.pio/build/display/bootloader.bin final-pages-site/display/bootloader.bin
          cp gaggimate-src/.pio/build/display/partitions.bin final-pages-site/display/partitions.bin

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

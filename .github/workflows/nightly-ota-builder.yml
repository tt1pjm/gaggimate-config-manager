name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src

      - name: Inject and Apply Board Overrides
        run: |
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          
          python3 scripts/generate_board_override.py
          ./scripts/apply_board_override_patch.sh

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      - name: Install PlatformIO and Build
        run: |
          pip install platformio
          cd gaggimate-src
          pio run -e controller -e display

      - name: Prepare WebUSB and OTA Assets
        run: |
          mkdir -p final-pages-site/controller final-pages-site/display
          
          # Deploy your primary user panel interface
          cp config-repo/index.html final-pages-site/
          
          # Position target configuration layouts
          cp config-repo/controller/manifest.json final-pages-site/controller/manifest.json
          cp config-repo/display/manifest.json final-pages-site/display/manifest.json
          
          # 1. EXTRACT BUNDLED COMPILER OUTPUTS FOR CONTROLLER
          cp gaggimate-src/.pio/build/controller/firmware.bin final-pages-site/controller/firmware.bin
          cp gaggimate-src/.pio/build/controller/bootloader.bin final-pages-site/controller/bootloader.bin
          cp gaggimate-src/.pio/build/controller/partitions.bin final-pages-site/controller/partitions.bin
          
          # 2. EXTRACT BUNDLED COMPILER OUTPUTS FOR DISPLAY
          cp gaggimate-src/.pio/build/display/firmware.bin final-pages-site/display/firmware.bin
          cp gaggimate-src/.pio/build/display/bootloader.bin final-pages-site/display/bootloader.bin
          cp gaggimate-src/.pio/build/display/partitions.bin final-pages-site/display/partitions.bin

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

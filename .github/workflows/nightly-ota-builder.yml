name: Nightly Custom Board OTA Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Configuration Registry
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout Upstream Gaggimate
        uses: actions/checkout@v4
        with:
          repository: jniebuhr/gaggimate
          ref: master
          path: gaggimate-src

      - name: Setup Node.js (Required for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build WebUI Frontend Assets
        run: |
          cd gaggimate-src
          if [ -d "web" ]; then
            cd web
            npm ci
            npm run build
            cd ..
          fi
          
          mkdir -p src/display/webassets
          if [ -f "scripts/build_webui.sh" ]; then
            chmod +x scripts/build_webui.sh
            ./scripts/build_webui.sh
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gaggimate-src/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gaggimate-src/platformio.ini') }}

      # UNIFIED RUN BLOCK: Sets folder context explicitly to preserve workspace assets in memory
      - name: Compile and Package All Firmware Targets
        run: |
          pip install platformio
          
          # Initialize flat destination directories in the root runner context
          mkdir -p final-pages-site/controller final-pages-site/display
          
          # Move inside the project directory containing platformio.ini for all builds
          cd gaggimate-src
          
          # 1. Compile the display natively while the shared libraries are clean
          pio run -e display
          
          # Extract the display binary pieces instantly while in the correct directory context
          cp .pio/build/display/firmware.bin ../final-pages-site/display/firmware.bin || cp .pio/build/LilyGo-T-RGB/firmware.bin ../final-pages-site/display/firmware.bin
          cp .pio/build/display/bootloader.bin ../final-pages-site/display/bootloader.bin || cp .pio/build/LilyGo-T-RGB/bootloader.bin ../final-pages-site/display/bootloader.bin
          cp .pio/build/display/partitions.bin ../final-pages-site/display/partitions.bin || cp .pio/build/LilyGo-T-RGB/partitions.bin ../final-pages-site/display/partitions.bin
          
          # Return to the root runner directory to apply patches
          cd ..
          
          # 2. Inject your custom configurations for the machine controller profile
          mkdir -p gaggimate-src/config gaggimate-src/scripts
          cp config-repo/config/board_override.json gaggimate-src/config/
          cp config-repo/scripts/* gaggimate-src/scripts/
          
          # Apply your script patches to the controller code
          cd gaggimate-src
          chmod +x scripts/apply_board_override_patch.sh
          python3 scripts/generate_board_override.py
          ./scripts/apply_board_override_patch.sh
          
          # 3. Compile the customized controller firmware
          pio run -e controller
          
          # Extract the controller binary pieces directly into the web assets map
          cp .pio/build/controller/firmware.bin ../final-pages-site/controller/firmware.bin
          cp .pio/build/controller/bootloader.bin ../final-pages-site/controller/bootloader.bin
          cp .pio/build/controller/partitions.bin ../final-pages-site/controller/partitions.bin
          
          # 4. Finalize static user panel dashboard assets
          cd ..
          cp config-repo/index.html final-pages-site/
          cp config-repo/controller/manifest.json final-pages-site/controller/manifest.json
          cp config-repo/display/manifest.json final-pages-site/display/manifest.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
